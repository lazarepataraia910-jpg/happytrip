<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="pageTitle">ტური — HappyTrip</title>
<meta name="description" id="pageDesc" content="ტურის დეტალები — HappyTrip" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23D9713C'/%3E%3Cpath d='M3 19h18L14.5 7l-3 5-2-2.5z' fill='white'/%3E%3C/svg%3E" />
<script>try{if(localStorage.getItem('ht_theme')==='"dark"')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<link rel="stylesheet" href="styles.css" />
<style>
  .tour-hero-media { aspect-ratio: 21/8; border-radius: 20px; margin-bottom: 26px; }
  .tour-head { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 22px; }
  .tour-head h1 { font-size: 30px; margin: 6px 0 10px; }
  .tour-head .card-loc { font-size: 13.5px; }
  .tour-actions { display: flex; gap: 8px; align-items: flex-start; }
  .tour-actions .btn-icon.active { border-color: var(--primary); color: var(--primary); }
  .detail-layout { display: grid; grid-template-columns: 1.6fr 1fr; gap: 32px; align-items: flex-start; }
  @media (max-width: 900px) { .detail-layout { grid-template-columns: 1fr; } }
  .spec-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin: 20px 0; }
  .spec-item { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; }
  .spec-item .feat-icon { width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0; margin-bottom: 0; }
  .spec-item .feat-icon svg { width: 16px; height: 16px; }
  .spec-item b { display: block; }
  .spec-item span { color: var(--slate); }
  .inc-exc { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
  @media (max-width: 560px) { .inc-exc { grid-template-columns: 1fr; } }
  .inc-exc ul { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-direction: column; gap: 8px; }
  .inc-exc li { display: flex; gap: 8px; font-size: 13.5px; align-items: flex-start; }
  .inc-exc .no svg { color: var(--danger); }
  .inc-exc .yes svg { color: var(--forest); }
  .itin-item { display: flex; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--line-light); }
  .itin-item:last-child { border-bottom: none; }
  .itin-day { width: 40px; height: 40px; border-radius: 50%; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
  .itin-item h4 { margin: 4px 0 6px; font-size: 15px; }
  .itin-item p { margin: 0; color: var(--slate); font-size: 13.5px; line-height: 1.6; }
  .review-item { padding: 18px 0; border-bottom: 1px solid var(--line-light); }
  .review-item:last-child { border-bottom: none; }
  .review-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .review-head .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--line-light); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: var(--forest); }
  .review-head b { display: block; font-size: 13.5px; }
  .review-head span { font-size: 11.5px; color: var(--slate); }
  .review-text { font-size: 13.5px; color: var(--text); line-height: 1.65; margin: 0; }
  .rating-summary { display: flex; align-items: center; gap: 16px; padding: 16px; background: var(--paper); border-radius: 14px; margin-bottom: 20px; }
  .rating-summary .big { font-size: 40px; font-weight: 800; }
  .book-panel { position: sticky; top: 90px; }
  .tier-option { display: flex; align-items: center; justify-content: space-between; padding: 13px 14px; border: 1px solid var(--line-light); border-radius: 12px; margin-bottom: 8px; cursor: pointer; }
  .tier-option.active { border-color: var(--primary); background: rgba(217,113,60,0.06); }
  .tier-option b { display: block; font-size: 13.5px; }
  .tier-option span { font-size: 12px; color: var(--slate); }
  .tier-option .price { font-weight: 700; font-size: 14px; }
  .total-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; font-size: 15px; font-weight: 700; border-top: 1px solid var(--line-light); margin-top: 12px; }
  .trust-row { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; font-size: 12.5px; color: var(--slate); }
  .trust-row div { display: flex; gap: 8px; align-items: center; }
</style>
</head>
<body data-page="tours">
<a class="skip-link" href="#main">გვერდის შემცველობაზე გადასვლა</a>
<header class="site-header" id="site-header"></header>

<main id="main">
  <div class="breadcrumb" id="breadcrumb"></div>
  <div id="tourContent"></div>
  <div id="notFound" style="display:none;text-align:center;padding:80px 24px">
    <h1>ტური ვერ მოიძებნა</h1>
    <p style="color:var(--slate);margin:10px 0 24px">შესაძლოა ბმული მოძველებულია — იხილეთ ყველა ტური.</p>
    <a class="btn btn-primary" href="tours.html">ტურების კატალოგი</a>
  </div>
</main>

<div class="sticky-cta mobile" id="mobileCta">
  <div><b id="mobilePrice">—</b><span style="display:block;font-size:11.5px;color:var(--slate)">1 პიროვნებაზე</span></div>
  <button class="btn btn-primary" id="mobileBookBtn">დაჯავშნა</button>
</div>

<footer class="site-footer" id="site-footer"></footer>

<script src="data.js"></script>
<script src="store.js"></script>
<script src="layout.js"></script>
<script>
  (function () {
    var slug = new URLSearchParams(window.location.search).get('slug');
    var tour = slug ? HT_DATA.getTourBySlug(slug) : null;

    if (!tour) {
      document.getElementById('notFound').style.display = 'block';
      document.getElementById('mobileCta').style.display = 'none';
      return;
    }

    var dest = HT_DATA.getDestinationById(tour.destinationId);
    document.getElementById('pageTitle').textContent = tour.title + ' — HappyTrip';
    document.getElementById('pageDesc').setAttribute('content', tour.summary);

    document.getElementById('breadcrumb').innerHTML =
      '<a href="index.html">მთავარი</a><span class="sep">/</span><a href="tours.html">ტურები</a><span class="sep">/</span>' +
      (dest ? '<a href="destination.html?slug=' + dest.slug + '">' + dest.name + '</a><span class="sep">/</span>' : '') +
      '<span class="current">' + tour.title + '</span>';

    var selectedTier = 'basic';
    var TIER_LABEL = { basic: 'საბაზისო', standard: 'სტანდარტი', premium: 'პრემიუმი' };

    function inclusionsHtml() {
      return '<div class="inc-exc"><div><b>რა შედის ფასში</b><ul>' +
        tour.inclusions.map(function (i) { return '<li class="yes">' + HT.icon('check') + ' ' + i + '</li>'; }).join('') +
        '</ul></div><div><b>რა არ შედის ფასში</b><ul>' +
        tour.exclusions.map(function (i) { return '<li class="no">' + HT.icon('x') + ' ' + i + '</li>'; }).join('') +
        '</ul></div></div>';
    }

    function specGridHtml() {
      var items = [
        [ 'clock', 'ხანგრძლივობა', tour.durationDays + ' დღე' ],
        [ 'compass', 'სირთულე', tour.difficultyLabel ],
        [ 'users', 'ჯგუფის ზომა', tour.groupMin + '–' + tour.groupMax + ' ადამიანი' ],
        [ 'mapPin', 'შეხვედრის წერტილი', tour.meetingPoint ],
        [ 'mail', 'ენები', tour.languages.join(', ') ],
        [ 'calendar', 'ტიპი', tour.typeLabel ]
      ];
      return '<div class="spec-grid">' + items.map(function (it) {
        return '<div class="spec-item"><div class="feat-icon">' + HT.icon(it[0]) + '</div><div><b>' + it[1] + '</b><span>' + it[2] + '</span></div></div>';
      }).join('') + '</div>';
    }

    function itineraryHtml() {
      return tour.itinerary.map(function (d) {
        return '<div class="itin-item"><div class="itin-day">' + d.day + '</div><div><h4>' + d.title + '</h4><p>' + d.desc + '</p></div></div>';
      }).join('');
    }

    function reviewsHtml() {
      var avg = tour.rating;
      return '<div class="rating-summary"><div class="big">' + avg + '</div><div><div>' + HT.starsHtml(avg) + '</div><div style="font-size:12.5px;color:var(--slate);margin-top:4px">' + tour.reviewCount + ' შეფასების საფუძველზე</div></div></div>' +
        tour.reviews.map(function (r) {
          return '<div class="review-item"><div class="review-head"><div class="avatar">' + r.initials + '</div><div><b>' + r.name + (r.verified ? ' &middot; დამოწმებული' : '') + '</b><span>' + r.date + '</span></div></div>' +
            '<div style="margin-bottom:6px">' + HT.starsHtml(r.rating) + '</div><p class="review-text">' + r.text + '</p></div>';
        }).join('');
    }

    var FAQ = [
      ['როგორ ხდება გადახდა?', 'ჯავშნის დადასტურების შემდეგ მიიღებთ ინსტრუქციას გადახდისთვის. შესაძლებელია დეპოზიტის გადახდაც სრული თანხის ნაცვლად.'],
      ['შემიძლია ჯავშნის გაუქმება?', 'დიახ, გაუქმების პირობები დამოკიდებულია თარიღამდე დარჩენილ დროზე — დეტალები იხილეთ გაუქმების პოლიტიკაში.'],
      ['რა ხდება ცუდი ამინდის შემთხვევაში?', 'უსაფრთხოების მიზნით მარშრუტი შეიძლება შეიცვალოს ან გადაიდოს — გიდი წინასწარ დაგიკავშირდებათ.'],
      ['შედის თუ არა სამოგზაურო დაზღვევა?', 'დაზღვევა ცალკე შეგიძლიათ დაამატოთ ჯავშნის დროს, თუ ტურის აღწერაში სხვაგვარად არ არის მითითებული.']
    ];
    function faqHtml() {
      return FAQ.map(function (f, i) {
        return '<div class="accordion-item' + (i === 0 ? ' open' : '') + '"><button class="accordion-q" data-acc>' + f[0] + '<span class="chev">' + HT.icon('chevronDown') + '</span></button><div class="accordion-a"><div class="accordion-a-inner">' + f[1] + '</div></div></div>';
      }).join('');
    }

    function relatedHtml() {
      var related = HT_DATA.getRelatedTours(tour, 3);
      if (!related.length) return '';
      return '<section class="section tight"><div class="section-head"><div class="eyebrow">მსგავსი</div><h2>შესაძლოა დაგაინტერესოთ</h2></div><div class="grid grid-3" id="relatedGrid"></div></section>';
    }

    document.getElementById('tourContent').innerHTML =
      '<div class="ph-media tour-hero-media ' + tour.theme + '">' + HT.icon(tour.icon) + '</div>' +
      '<div class="tour-head">' +
        '<div><div class="card-loc">' + HT.icon('mapPin') + ' ' + (dest ? dest.name : '') + '</div>' +
        '<h1 class="display">' + tour.title + '</h1>' +
        '<div class="card-meta"><span class="tag">' + tour.typeLabel + '</span><span class="card-rating">' + HT.icon('star') + ' ' + tour.rating + ' (' + tour.reviewCount + ' შეფასება)</span></div></div>' +
        '<div class="tour-actions">' +
          '<button class="btn btn-icon btn-ghost" id="wishBtn" aria-label="რჩეულებში დამატება">' + HT.icon('heart') + '</button>' +
          '<button class="btn btn-icon btn-ghost" id="compareBtn" aria-label="შედარებაში დამატება">' + HT.icon('compare') + '</button>' +
          '<button class="btn btn-icon btn-ghost" id="shareBtn" aria-label="გაზიარება">' + HT.icon('share') + '</button>' +
        '</div>' +
      '</div>' +
      '<p style="font-size:15px;line-height:1.7;color:var(--text);max-width:760px">' + tour.summary + '</p>' +
      '<div class="detail-layout">' +
        '<div>' +
          '<div class="tabs">' +
            '<button class="tab-btn active" data-tab="overview">მიმოხილვა</button>' +
            '<button class="tab-btn" data-tab="itinerary">დღიური მარშრუტი</button>' +
            '<button class="tab-btn" data-tab="reviews">მიმოხილვები (' + tour.reviewCount + ')</button>' +
          '</div>' +
          '<div class="tab-panel active" data-panel="overview">' + specGridHtml() + inclusionsHtml() + '</div>' +
          '<div class="tab-panel" data-panel="itinerary">' + itineraryHtml() + '</div>' +
          '<div class="tab-panel" data-panel="reviews">' + reviewsHtml() + '</div>' +
          '<div class="section-head" style="margin-top:32px"><div class="eyebrow">კითხვები</div><h2>ხშირად დასმული კითხვები</h2></div>' +
          faqHtml() +
        '</div>' +
        '<div class="book-panel panel">' +
          '<div id="tierList"></div>' +
          '<div class="field"><label for="travelerCount">მოგზაურთა რაოდენობა</label><input type="number" id="travelerCount" min="1" value="2" /></div>' +
          '<div class="field"><label for="preferredDate">სასურველი თარიღი</label><input type="date" id="preferredDate" /><p class="field-hint">საბოლოო ხელმისაწვდომობას გიდი დაგიდასტურებთ ჯავშნის შემდეგ.</p></div>' +
          '<div class="total-row"><span>ჯამური ღირებულება</span><span id="totalPrice">—</span></div>' +
          '<button class="btn btn-primary btn-block" id="bookBtn">დაჯავშნე ახლავე</button>' +
          '<div class="trust-row">' +
            '<div>' + HT.icon('shield') + ' უსაფრთხო და დაცული ჯავშანი</div>' +
            '<div>' + HT.icon('check') + ' უფასო გაუქმება 7 დღით ადრე</div>' +
            '<div>' + HT.icon('headset') + ' მხარდაჭერა მოგზაურობის დროს</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      relatedHtml();

    // tabs
    document.querySelectorAll('.tab-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
        document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.remove('active'); });
        btn.classList.add('active');
        document.querySelector('[data-panel="' + btn.dataset.tab + '"]').classList.add('active');
      });
    });
    // accordion
    document.querySelectorAll('[data-acc]').forEach(function (btn) {
      btn.addEventListener('click', function () { btn.closest('.accordion-item').classList.toggle('open'); });
    });

    // price tiers
    var tierListEl = document.getElementById('tierList');
    function renderTiers() {
      var tiers = ['basic', 'standard', 'premium'];
      tierListEl.innerHTML = tiers.map(function (tier) {
        var price = HT_DATA.finalPrice(tour, tier);
        return '<div class="tier-option' + (tier === selectedTier ? ' active' : '') + '" data-tier="' + tier + '"><div><b>' + TIER_LABEL[tier] + '</b><span>1 პიროვნებაზე</span></div><div class="price">' + HT.formatGel(price) + '</div></div>';
      }).join('');
      tierListEl.querySelectorAll('[data-tier]').forEach(function (el) {
        el.addEventListener('click', function () { selectedTier = el.dataset.tier; renderTiers(); updateTotal(); });
      });
    }
    function updateTotal() {
      var n = Math.max(1, Number(document.getElementById('travelerCount').value) || 1);
      var price = HT_DATA.finalPrice(tour, selectedTier);
      var total = price * n;
      document.getElementById('totalPrice').textContent = HT.formatGel(total);
      document.getElementById('mobilePrice').textContent = HT.formatGel(price);
    }
    renderTiers();
    updateTotal();
    document.getElementById('travelerCount').addEventListener('input', updateTotal);

    function goBook() {
      var n = Math.max(1, Number(document.getElementById('travelerCount').value) || 1);
      var date = document.getElementById('preferredDate').value;
      var params = new URLSearchParams({ slug: tour.slug, tier: selectedTier, travelers: n, date: date });
      window.location.href = 'booking.html?' + params.toString();
    }
    document.getElementById('bookBtn').addEventListener('click', goBook);
    document.getElementById('mobileBookBtn').addEventListener('click', goBook);

    // wishlist / compare / share
    var wishBtn = document.getElementById('wishBtn');
    wishBtn.classList.toggle('active', HT_STORE.isWishlisted(tour.id));
    wishBtn.addEventListener('click', function () {
      var active = HT_STORE.toggleWishlist(tour.id);
      wishBtn.classList.toggle('active', active);
      HT.updateWishCount();
      HT.toast(active ? 'დაემატა რჩეულებში' : 'ამოშალა რჩეულებიდან');
    });
    var compareBtn = document.getElementById('compareBtn');
    compareBtn.classList.toggle('active', HT_STORE.isComparing(tour.id));
    compareBtn.addEventListener('click', function () {
      var res = HT_STORE.toggleCompare(tour.id);
      if (res.full) { HT.toast('შედარებაში მაქსიმუმ 3 ტურის დამატებაა შესაძლებელი'); return; }
      compareBtn.classList.toggle('active', res.added);
      HT.toast(res.added ? 'დაემატა შედარებაში' : 'ამოშალა შედარებიდან');
    });
    document.getElementById('shareBtn').addEventListener('click', function () {
      var url = window.location.href;
      if (navigator.share) { navigator.share({ title: tour.title, url: url }).catch(function () {}); return; }
      if (navigator.clipboard) { navigator.clipboard.writeText(url).then(function () { HT.toast('ბმული დაკოპირდა'); }); }
    });

    var relatedGrid = document.getElementById('relatedGrid');
    if (relatedGrid) HT_DATA.getRelatedTours(tour, 3).forEach(function (t) { relatedGrid.appendChild(HT.tourCard(t)); });
  })();
</script>
</body>
</html>
