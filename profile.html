<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ჩემი პროფილი — HappyTrip</title>
<meta name="description" content="თქვენი ჯავშნები, რჩეულები და ანგარიშის პარამეტრები." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23D9713C'/%3E%3Cpath d='M3 19h18L14.5 7l-3 5-2-2.5z' fill='white'/%3E%3C/svg%3E" />
<script>try{if(localStorage.getItem('ht_theme')==='"dark"')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<link rel="stylesheet" href="styles.css" />
<style>
  .booking-card { border: 1px solid var(--line-light); border-radius: 14px; padding: 18px; margin-bottom: 14px; background: var(--surface); }
  .booking-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
  .booking-card-head h3 { margin: 2px 0 4px; font-size: 15.5px; }
  .booking-ref { font-size: 12px; color: var(--slate); font-family: monospace; }
  .status-pill { padding: 5px 12px; border-radius: 999px; font-size: 11.5px; font-weight: 700; background: rgba(47,93,80,0.14); color: var(--forest); white-space: nowrap; }
  :root[data-theme="dark"] .status-pill { color: #9FD6C4; }
  .status-pill.cancelled { background: rgba(194,59,59,0.12); color: var(--danger); }
  .booking-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--slate); margin-bottom: 12px; }
  .booking-actions { display: flex; gap: 8px; }
  .theme-switch { display: flex; gap: 8px; }
  .theme-opt { flex: 1; padding: 14px; border: 1px solid var(--line-light); border-radius: 12px; text-align: center; font-size: 13px; font-weight: 700; cursor: pointer; }
  .theme-opt.active { border-color: var(--primary); background: rgba(217,113,60,0.06); }
  .theme-opt svg { display: block; margin: 0 auto 8px; }
</style>
</head>
<body data-page="profile">
<a class="skip-link" href="#main">გვერდის შემცველობაზე გადასვლა</a>
<header class="site-header" id="site-header"></header>

<div class="page-hero">
  <div class="wrap">
    <div class="breadcrumb"><a href="index.html">მთავარი</a><span class="sep">/</span><span class="current">ჩემი პროფილი</span></div>
    <div class="eyebrow" id="profileGreeting">მოგესალმებით</div>
    <h1 class="display">ჩემი პროფილი</h1>
  </div>
</div>

<main id="main">
  <div class="tabs" id="profileTabs">
    <button class="tab-btn" data-tab="bookings">ჯავშნები</button>
    <button class="tab-btn" data-tab="wishlist">რჩეულები</button>
    <button class="tab-btn" data-tab="settings">პარამეტრები</button>
  </div>

  <div class="tab-panel" data-panel="bookings">
    <div id="bookingsList"></div>
    <div class="empty-state" id="bookingsEmpty"><p>ჯერ არცერთი ჯავშანი არ გაქვთ</p><a class="btn btn-dark" href="tours.html">ტურების დათვალიერება</a></div>
  </div>

  <div class="tab-panel" data-panel="wishlist">
    <div class="grid" id="wishlistGrid"></div>
    <div class="empty-state" id="wishlistEmpty"><p>რჩეულების სია ცარიელია</p><a class="btn btn-dark" href="tours.html">ტურების დათვალიერება</a></div>
  </div>

  <div class="tab-panel" data-panel="settings">
    <div class="panel" style="max-width:440px">
      <h3 style="margin:0 0 14px;font-size:15px">სახელი</h3>
      <div class="field"><input type="text" id="nameInput" placeholder="თქვენი სახელი" /></div>
      <button class="btn btn-primary" id="saveNameBtn">შენახვა</button>
      <div class="divider"></div>
      <h3 style="margin:0 0 14px;font-size:15px">გარეგნობა</h3>
      <div class="theme-switch">
        <div class="theme-opt" data-theme-opt="light"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>ღია</div>
        <div class="theme-opt" data-theme-opt="dark"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>მუქი</div>
      </div>
      <div class="divider"></div>
      <button class="btn btn-ghost btn-block" id="clearProfileBtn">ანგარიშის სახელის წაშლა</button>
    </div>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="data.js"></script>
<script src="store.js"></script>
<script src="layout.js"></script>
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var profile = HT_STORE.getProfile();
    document.getElementById('profileGreeting').textContent = profile ? 'გამარჯობა, ' + profile.name : 'სტუმარი';
    document.getElementById('nameInput').value = profile ? profile.name : '';

    var tabs = document.querySelectorAll('#profileTabs .tab-btn');
    var panels = document.querySelectorAll('.tab-panel');
    function activate(tabName) {
      tabs.forEach(function (t) { t.classList.toggle('active', t.dataset.tab === tabName); });
      panels.forEach(function (p) { p.classList.toggle('active', p.dataset.panel === tabName); });
    }
    tabs.forEach(function (t) { t.addEventListener('click', function () { activate(t.dataset.tab); }); });
    activate(params.get('tab') === 'wishlist' ? 'wishlist' : (params.get('tab') === 'settings' ? 'settings' : 'bookings'));

    var STATUS_CLASS = { 'გაუქმებული': 'cancelled' };
    function renderBookings() {
      var list = HT_STORE.getBookings();
      var wrap = document.getElementById('bookingsList');
      wrap.innerHTML = '';
      document.getElementById('bookingsEmpty').classList.toggle('show', list.length === 0);
      list.forEach(function (b) {
        var el = document.createElement('div');
        el.className = 'booking-card';
        el.innerHTML =
          '<div class="booking-card-head"><div><h3>' + b.tourTitle + '</h3><span class="booking-ref">' + b.reference + '</span></div>' +
          '<span class="status-pill ' + (STATUS_CLASS[b.status] || '') + '">' + b.status + '</span></div>' +
          '<div class="booking-meta"><span>' + HT.icon('calendar') + ' ' + (b.date || 'თარიღი შეთანხმებით') + '</span><span>' + HT.icon('users') + ' ' + b.travelers + ' მოგზაური</span><span><b>' + HT.formatGel(b.total) + '</b></span></div>' +
          '<div class="booking-actions">' +
          '<button class="btn btn-ghost btn-sm" data-cancel="' + b.reference + '"' + (b.status === 'გაუქმებული' ? ' disabled' : '') + '>ჯავშნის გაუქმება</button>' +
          '</div>';
        wrap.appendChild(el);
      });
      wrap.querySelectorAll('[data-cancel]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          HT_STORE.cancelBooking(btn.dataset.cancel);
          HT.toast('ჯავშანი გაუქმდა');
          renderBookings();
        });
      });
    }
    renderBookings();

    function renderWishlist() {
      var ids = HT_STORE.getWishlist();
      var grid = document.getElementById('wishlistGrid');
      grid.innerHTML = '';
      document.getElementById('wishlistEmpty').classList.toggle('show', ids.length === 0);
      ids.forEach(function (id) {
        var t = HT_DATA.getTourById(id);
        if (t) grid.appendChild(HT.tourCard(t, { onWishChange: renderWishlist }));
      });
    }
    renderWishlist();

    document.getElementById('saveNameBtn').addEventListener('click', function () {
      var name = document.getElementById('nameInput').value.trim();
      if (!name) { HT.toast('შეიყვანეთ სახელი'); return; }
      HT_STORE.setProfile({ name: name, joinedAt: (profile && profile.joinedAt) || new Date().toISOString() });
      HT.renderAuthSlot();
      document.getElementById('profileGreeting').textContent = 'გამარჯობა, ' + name;
      HT.toast('შენახულია');
    });
    document.getElementById('clearProfileBtn').addEventListener('click', function () {
      HT_STORE.clearProfile();
      HT.renderAuthSlot();
      document.getElementById('nameInput').value = '';
      document.getElementById('profileGreeting').textContent = 'სტუმარი';
      HT.toast('სახელი წაიშალა');
    });

    var themeOpts = document.querySelectorAll('[data-theme-opt]');
    function refreshThemeUI() {
      var current = HT_STORE.getTheme();
      themeOpts.forEach(function (el) { el.classList.toggle('active', el.dataset.themeOpt === current); });
    }
    themeOpts.forEach(function (el) {
      el.addEventListener('click', function () {
        HT_STORE.setTheme(el.dataset.themeOpt);
        refreshThemeUI();
      });
    });
    refreshThemeUI();
  })();
</script>
</body>
</html>
