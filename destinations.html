<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>დანიშნულებები — HappyTrip</title>
<meta name="description" content="საქართველოს რეგიონები — თბილისიდან სვანეთამდე. აღმოაჩინეთ თითოეული მიმართულების საუკეთესო დრო, ღირშესანიშნაობები და ტურები." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23D9713C'/%3E%3Cpath d='M3 19h18L14.5 7l-3 5-2-2.5z' fill='white'/%3E%3C/svg%3E" />
<script>try{if(localStorage.getItem('ht_theme')==='"dark"')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<!-- Vercel Web Analytics -->
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<link rel="stylesheet" href="styles.css" />
<style>
  .dest-full-card { position: relative; border-radius: 18px; overflow: hidden; aspect-ratio: 4/3.1; display: flex; align-items: flex-end; }
  .dest-full-card .ph-media { position: absolute; inset: 0; }
  .dest-full-info { position: relative; z-index: 2; padding: 20px; color: #fff; background: linear-gradient(0deg, rgba(0,0,0,0.62), transparent 65%); width: 100%; }
  .dest-full-info .region { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.6px; opacity: 0.75; }
  .dest-full-info h3 { margin: 4px 0 8px; font-size: 19px; }
  .dest-full-info p { margin: 0 0 12px; font-size: 12.5px; opacity: 0.85; line-height: 1.5; max-width: 90%; }
  .dest-full-info a.btn { padding: 9px 16px; font-size: 13px; }
</style>
</head>
<body data-page="destinations">
<a class="skip-link" href="#main">გვერდის შემცველობაზე გადასვლა</a>
<header class="site-header" id="site-header"></header>

<div class="page-hero">
  <div class="wrap">
    <div class="breadcrumb"><a href="index.html">მთავარი</a><span class="sep">/</span><span class="current">დანიშნულებები</span></div>
    <div class="eyebrow">9 რეგიონი</div>
    <h1 class="display">საქართველოს დანიშნულებები</h1>
    <p>მთიდან ზღვამდე — გაეცანით თითოეულ რეგიონს და აირჩიეთ, სად დაიწყოთ თქვენი მოგზაურობა.</p>
  </div>
</div>

<main id="main">
  <div class="filters-bar">
    <div class="filters-row">
      <input type="text" id="dQ" placeholder="ძებნა დანიშნულების სახელით..." />
    </div>
  </div>
  <div class="grid grid-3" id="destGrid"></div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="data.js"></script>
<script src="store.js"></script>
<script src="layout.js"></script>
<script>
  HT_DATA.ready().then(function () {
    var grid = document.getElementById('destGrid');
    function render(q) {
      grid.innerHTML = '';
      var list = HT_DATA.getDestinations();
      if (q) { q = q.toLowerCase(); list = list.filter(function (d) { return d.name.toLowerCase().indexOf(q) !== -1 || d.region.toLowerCase().indexOf(q) !== -1; }); }
      list.forEach(function (d) {
        var el = document.createElement('div');
        el.className = 'card dest-full-card';
        el.innerHTML = '<div class="ph-media ' + d.theme + '">' + HT.icon(d.icon) + '</div>' +
          '<div class="dest-full-info"><div class="region">' + d.region + '</div><h3>' + d.name + '</h3><p>' + d.tagline + '</p>' +
          '<a class="btn btn-primary" href="destination.html?slug=' + d.slug + '">დანახვა</a></div>';
        grid.appendChild(el);
      });
    }
    document.getElementById('dQ').addEventListener('input', function (e) { render(e.target.value); });
    render('');
  });
</script>
</body>
</html>
